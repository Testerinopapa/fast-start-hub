name: Splee Server + Lovable AI Deployment QA

on:
  push:
    branches: [main, 'feat/splee-*']
    paths:
      - 'deploy/splee/**'
      - 'scripts/test_splee_lovable_deploy.py'
      - '.github/workflows/splee-lovable-deployment-qa.yml'
  pull_request:
    paths:
      - 'deploy/splee/**'
      - 'scripts/test_splee_lovable_deploy.py'
      - '.github/workflows/splee-lovable-deployment-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse Render and LiteLLM configuration
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Run deployment security checks
        run: |
          python -m unittest discover -s scripts -p 'test_splee_lovable_deploy.py' -v
          sh -n deploy/splee/backend/start.sh
          sh -n deploy/splee/gateway/start.sh
      - name: Summarize what has and has NOT been tested
        if: always()
        run: |
          {
            echo '## Splee → Lovable AI deployment configuration'
            echo ''
            echo '- Checked Render Blueprint, Rust/Claude CLI Docker setup, gateway alias and secret wiring.'
            echo '- The tests do not build the Rust image, launch LiteLLM, spend AI credits or deploy paid services.'
            echo '- Live model compatibility (Claude web tools / structured output) remains unproven until the service, project key and model are tested.'
            echo '- Email sending is disabled and the public agent is disabled.'
          } >> "$GITHUB_STEP_SUMMARY"
