name: Splee Evidence Gateway Deploy Attempt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OPENOUTFIND_LLM_API_KEY: ${{ secrets.OPENOUTFIND_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deployment credentials exist
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured in this GitHub repository; cannot deploy Splee evidence function."
            exit 1
          fi
          if [ -z "$OPENOUTFIND_LLM_API_KEY" ]; then
            echo "::error::Existing Explee AI bearer key is missing."
            exit 1
          fi
      - name: Recheck evidence handler before deployment
        working-directory: supabase/functions
        run: |
          npx --yes deno@2.9.6 check splee-web/index.ts
          npx --yes deno@2.9.6 test --allow-env splee-web/index_test.ts
      - name: Inspect pinned Supabase CLI deployment interface
        run: npx --yes supabase@2.81.3 functions deploy --help > /dev/null
      - name: Deploy only the Splee evidence Edge Function to the model gateway project
        run: |
          npx --yes supabase@2.81.3 functions deploy splee-web \
            --project-ref emlggkmtbosahpzrxaul --no-verify-jwt
      - name: Validate deployed endpoint and shared bearer token without running a search
        run: |
          code=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' \
            -X POST 'https://emlggkmtbosahpzrxaul.supabase.co/functions/v1/splee-web/v1/web/search' \
            -H "Authorization: Bearer $OPENOUTFIND_LLM_API_KEY" \
            -H 'x-explee-run-id: invalid-preflight-id' \
            -H 'Content-Type: application/json' \
            --data '{"query":"public source preflight"}' || true)
          echo "Authenticated evidence endpoint preflight HTTP $code"
          if [ "$code" != 400 ]; then
            echo "::error::Edge Function is deployed but the expected token/route is not verified; no search or model request performed."
            exit 1
          fi
