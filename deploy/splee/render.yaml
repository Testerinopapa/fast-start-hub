# QA-only Splee backend and Lovable AI compatibility gateway.
# DO NOT approve this Render Blueprint without reviewing paid compute/database
# costs and setting LOVABLE_API_KEY on the private gateway first.
#
# Splee: Iweisc/splee@3c2b1723bc9651a2cd2872ae6a3b4939501c8435
# License: AGPL-3.0-only; upstream source and Docker build instructions public.
services:
  - type: pserv
    name: explee-splee-ai-gateway
    runtime: docker
    region: virginia
    plan: 1c-2g
    dockerfilePath: ./deploy/splee/gateway/Dockerfile
    dockerContext: .
    envVars:
      - key: LOVABLE_API_KEY
        sync: false
      - key: GATEWAY_SHARED_SECRET
        generateValue: true
      - key: LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES
        value: "true"

  - type: web
    name: explee-splee-backend
    runtime: docker
    region: virginia
    plan: 1c-2g
    dockerfilePath: ./deploy/splee/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: explee-splee-postgres
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: PUBLIC_URL
        fromService:
          type: web
          name: explee-splee-backend
          property: url
      - key: API_URL
        fromService:
          type: web
          name: explee-splee-backend
          property: url
      - key: GATEWAY_HOST
        fromService:
          type: pserv
          name: explee-splee-ai-gateway
          property: host
      - key: GATEWAY_SHARED_SECRET
        fromService:
          type: pserv
          name: explee-splee-ai-gateway
          envVarKey: GATEWAY_SHARED_SECRET
      - key: BIND_ADDR
        value: 0.0.0.0:10000
      - key: AGENT_MODEL
        value: claude-sonnet-5-5
      - key: AGENT_CONCURRENCY
        value: "1"
      - key: SENDING_ENABLED
        value: "false"
      - key: PUBLIC_AGENT
        value: "false"
      - key: OPEN_SIGNUP
        value: "false"
      - key: RUST_LOG
        value: splee=info,tower_http=warn

databases:
  - name: explee-splee-postgres
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
